name: Security Audit

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '0 0 * * 1' # 毎週月曜日に実行

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - run: npm ci

      - name: Audit Production Dependencies (print details)
        run: |
          npm audit --omit=dev --json | tee audit-omit-dev.json
          node -e "const a=require('./audit-omit-dev.json'); console.log('audit metadata:', a.metadata)"

      - name: Audit All Dependencies (Report Only)
        run: npm audit || true
        # 開発依存関係(devDependencies)も含めてチェックするが、CIは失敗させない
        # (xlsx等のdev依存の既知の脆弱性でブロックされないようにするため)
