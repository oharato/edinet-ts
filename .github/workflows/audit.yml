name: Security Audit

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 0 * * 1' # 毎週月曜日に実行

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Use declared npm version
        run: npm install --global npm@12.2.1 --no-audit --no-fund
      - run: npm ci

      - name: Audit Production Dependencies (print details)
        run: |
          npm audit --omit=dev --json | tee audit-omit-dev.json
          node -e "const a=require('./audit-omit-dev.json'); console.log('audit metadata:', a.metadata)"

      - name: Audit All Dependencies (Report Only)
        run: npm audit || true
        # 開発依存関係(devDependencies)も含めてチェックするが、CIは失敗させない
        # 開発依存の検出結果は既存方針どおり報告用とする
