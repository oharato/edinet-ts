name: Live EDINET smoke

# 実APIの最小確認は手動実行のみ。毎PRでは走らせず、APIキーも使いません。
on:
  workflow_dispatch:
    inputs:
      date:
        description: "確認する日付 (YYYY-MM-DD)。空なら日本時間の当日からさかのぼって探します"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: live-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Use declared npm version
        run: npm install --global npm@12.2.1 --no-audit --no-fund
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check the EDINET_API_KEY secret is configured
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
        run: |
          if [ -z "$EDINET_API_KEY" ]; then
            echo "::error::EDINET_API_KEY secret is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
      - name: Fetch one document list and check large-shareholding codes
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
        run: npx --no-install tsx scripts/live-smoke.ts ${{ inputs.date }}
