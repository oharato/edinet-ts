name: Source checks

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Use declared npm version
        run: npm install --global npm@12.2.1 --no-audit --no-fund
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Check types
        run: npx --no-install tsc --noEmit
      - name: Compile SDK for API and CLI checks
        run: |
          npm run prepare-financial-verifier
          npx --no-install tsc
          npm run add-js-extensions
      - name: Check public API type examples
        run: npx --no-install tsc --project test/types/tsconfig.json
      # ESM integration tests rebuild the package; exercise distribution builds on nuc7.
      - name: Run source tests
        run: npm test -- --maxWorkers=1 --exclude test/esm-imports.test.ts
      - name: Test local artifact publication safeguards
        run: python3 scripts/test_artifact_store.py
      - name: Test Python verification helpers
        run: python3 -m unittest discover -s test -p '*_test.py'
